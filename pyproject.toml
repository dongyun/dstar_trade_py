# Build and package metadata for the Linux-only Python SDK.
[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
    # A wheel-provided CMake lets PEP 517 builds work without a system package.
    "cmake>=3.18",
]
build-backend = "scikit_build_core.build"

[project]
name = "dstar-trade-py"
version = "0.1.0"
description = "Linux-only Python SDK bindings for the Esunny Dstar V10 domestic trade API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "dstar_trade_py contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.scikit-build]
# The Python package is installed together with the CMake-built extension.
wheel.packages = ["dstar_trade_py"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
